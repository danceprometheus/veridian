<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVN: VERIDIAN - Hall of Clarity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- HUD -->
    <div class="top-hud hud">
        <div class="hud-section">
            <h1>VERIDIAN</h1>
            <p>Hall of Clarity</p>
        </div>
        <div class="hud-section" style="text-align: right;">
            <div id="user-info">
                <p id="user-display-name">Loading...</p>
                <button id="sign-out-btn" class="btn-secondary" style="display: none;">Sign Out</button>
            </div>
        </div>
    </div>
    
    <div class="bottom-hud hud">
        <div class="stat-group">
            <div class="stat-item">
                <span class="stat-label">STATUS</span>
                <span class="stat-value" id="status">Observing</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">COORDINATES</span>
                <span class="stat-value" id="coords">0, 0, 0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">ENTITIES</span>
                <span class="stat-value" id="entity-count">12</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">ARTWORKS</span>
                <span class="stat-value" id="gallery-count">0</span>
            </div>
        </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <h2>VERIDIAN</h2>
            <div class="loading-bar">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
        </div>
    </div>
    
    <!-- Message Display -->
    <div id="message-display"></div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
